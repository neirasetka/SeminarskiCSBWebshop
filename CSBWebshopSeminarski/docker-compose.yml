services:
  rabbitMQ:
    image: rabbitmq:3-management
    container_name: 'rabbitmq_container'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    expose:
      - 5672
    networks:
      - csb_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  csb_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ib180005_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${SQL_SA_PASSWORD:-YourStrongPassword!}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - csb_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  csb_webapi:
    restart: unless-stopped
    build:
      context: .
      dockerfile: CSBWebshopSeminarski/Dockerfile
    container_name: ib180005_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CocoSunBagsWebshop: "Server=csb_sqlserver;Database=180005;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrongPassword!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      RabbitMQ__HostName: rabbitMQ
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      JWTSettings__Key: ${JWT_KEY:-REPLACE_WITH_SECURE_JWT_KEY_MIN_32_CHARS}
      # Do not set Smtp__* or Stripe__SecretKey to empty defaults — they override appsettings.
      # For production SMTP, set SMTP_USERNAME/SMTP_PASSWORD in .env (see .env.example).
      # For production, define STRIPE_SECRET_KEY in .env (see .env.example).
    networks:
      - csb_network
    depends_on:
      csb_sqlserver:
        condition: service_healthy
      rabbitMQ:
        condition: service_started

  csb_notifications:
    restart: unless-stopped
    build:
      context: .
      dockerfile: CSBWebshopSeminarski.Notifications/Dockerfile
    container_name: csb_notifications
    environment:
      RABBITMQ_HOST: rabbitMQ
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # SMTP credentials come from appsettings.json in local Docker dev.
      # For production, set SMTP_USERNAME/SMTP_PASSWORD in .env (see .env.example).
    depends_on:
      csb_sqlserver:
        condition: service_healthy
      csb_webapi:
        condition: service_started
      rabbitMQ:
        condition: service_started
    networks:
      - csb_network

volumes:
  sqlserverdata:
  rabbitmq_data:

networks:
  csb_network:
    driver: bridge
