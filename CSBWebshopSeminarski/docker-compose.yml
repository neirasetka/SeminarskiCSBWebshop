services:
  rabbitMQ:
    image: rabbitmq:3-management
    container_name: 'rabbitmq_container'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    expose:
      - 5672
    networks:
      - csb_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  csb_sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: ib180005_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${SQL_SA_PASSWORD:-YourStrongPassword!}
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - csb_network

  csb_webapi:
    restart: unless-stopped
    build:
      context: .
      dockerfile: CSBWebshopSeminarski/Dockerfile
    container_name: ib180005_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CocoSunBagsWebshop: "Server=csb_sqlserver;Database=180005;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrongPassword!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      RabbitMQ__HostName: rabbitMQ
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: ${RABBITMQ_USERNAME:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      JWTSettings__Key: ${JWT_KEY:-REPLACE_WITH_SECURE_JWT_KEY_MIN_32_CHARS}
      Smtp__User: ${SMTP_USERNAME:-}
      Smtp__Pass: ${SMTP_PASSWORD:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
    networks:
      - csb_network
    depends_on:
      - csb_sqlserver
      - rabbitMQ

  csb_notifications:
    restart: unless-stopped
    build:
      context: .
      dockerfile: CSBWebshopSeminarski.Notifications/Dockerfile
    container_name: csb_notifications
    environment:
      RABBITMQ_HOST: rabbitMQ
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - csb_sqlserver
      - csb_webapi
      - rabbitMQ
    networks:
      - csb_network

volumes:
  sqlserverdata:
  rabbitmq_data:

networks:
  csb_network:
    driver: bridge
